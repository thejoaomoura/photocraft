org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Rust library build (see app/build.gradle.kts › cargoBuild):
# ABIs to build, comma-separated (arm64-v8a for phones, x86_64 for the emulator).
photocraft.abis=arm64-v8a
# true: use the .so and Kotlin bindings already in place (CI downloads them from the Rust job).
photocraft.skipRust=false
