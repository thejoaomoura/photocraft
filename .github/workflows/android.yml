name: Android

# Builds the lightweight mobile app's native library (`crates/mobile-ffi`): the engine for Android
# (arm64 phones, x86_64 emulators) plus its Kotlin bindings, uploaded as one artifact that drops
# into the Android project (`jniLibs/` and `java/`).

on:
  push:
    branches: [main, "feat/android-*"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The `.so` ships in the APK: no symbol tables.
  CARGO_PROFILE_RELEASE_STRIP: symbols

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test mobile-ffi (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-ffi-host
      - name: Test
        run: cargo test -p photocraft-mobile-ffi
      - name: Clippy
        run: cargo clippy -p photocraft-mobile-ffi --all-targets -- -D warnings

  build:
    name: build Android library
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-ffi-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # GitHub's Ubuntu image ships the Android SDK and NDK.
      - name: Select NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
      - name: Build .so (arm64-v8a, x86_64)
        run: cargo ndk -t arm64-v8a -t x86_64 -o dist/android/jniLibs build -p photocraft-mobile-ffi --release
      - name: Generate Kotlin bindings
        run: |
          cargo build -p photocraft-mobile-ffi --lib
          cargo run -p photocraft-mobile-ffi --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libphotocraft_mobile.so --language kotlin --out-dir dist/android/java
      - name: Summary
        run: |
          {
            echo "### PhotoCraft mobile library"
            echo '```'
            find dist/android -type f -exec ls -lh {} \; | awk '{print $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-mobile-android
          path: dist/android
          if-no-files-found: error
